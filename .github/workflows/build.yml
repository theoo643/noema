name: Build NOEMA

on:
  push:
    tags:
      - 'v*'

jobs:

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pywebview
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller NOEMA.spec

      - name: Package DMG
        run: |
          mkdir dmg_tmp
          cp -r dist/NOEMA.app dmg_tmp/
          ln -s /Applications dmg_tmp/Applications
          hdiutil create -volname NOEMA -srcfolder dmg_tmp -ov -format UDZO NOEMA.dmg

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NOEMA-macOS
          path: NOEMA.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pywebview pillow
          pip install -r requirements.txt

      - name: Convert icon to .ico
        run: |
          python -c "
          from PIL import Image
          import struct, zlib

          img = Image.open('noema.icns')
          sizes = [16, 32, 48, 64, 128, 256]
          imgs = []
          for s in sizes:
              imgs.append(img.resize((s, s), Image.LANCZOS))
          imgs[0].save('noema.ico', format='ICO', sizes=[(s, s) for s in sizes], append_images=imgs[1:])
          print('Icon converted successfully')
          "
        shell: pwsh

      - name: Build
        run: pyinstaller NOEMA_win.spec --icon=noema.ico

      - name: Zip
        run: Compress-Archive -Path dist\NOEMA -DestinationPath NOEMA-Windows.zip
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NOEMA-Windows
          path: NOEMA-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 libgirepository1.0-dev gcc libcairo2-dev \
            pkg-config python3-dev
          pip install pyinstaller pywebview
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller NOEMA_linux.spec

      - name: Zip
        run: zip -r NOEMA-Linux.zip dist/NOEMA

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NOEMA-Linux
          path: NOEMA-Linux.zip

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NOEMA-macOS/NOEMA.dmg
            NOEMA-Windows/NOEMA-Windows.zip
            NOEMA-Linux/NOEMA-Linux.zip
          body: |
            ## Install

            | Platform | Download |
            |----------|----------|
            | macOS | `NOEMA.dmg` — open, drag to Applications. Right-click → Open on first launch |
            | Windows | `NOEMA-Windows.zip` — extract and run `NOEMA.exe` |
            | Linux | `NOEMA-Linux.zip` — extract, `chmod +x NOEMA/NOEMA`, then run |

            **Requires [Ollama](https://ollama.com) to be installed and running.**
